<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İdrak Liseyi - Canlı Görüşmə</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #111214; /* Discord Pure Dark */
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ─── Discord Top Navbar ─── */
    .navbar {
      background-color: #1E1F22;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #5865F2, #4752C4); /* Discord Blurple */
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #FFF;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 10.5px;
      color: #949BA4;
      font-weight: 500;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(35, 165, 90, 0.15);
      color: #23A55A; /* Discord Green */
      border: 1px solid rgba(35, 165, 90, 0.3);
      flex-shrink: 0;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #23A55A;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ─── Main Content Views ─── */
    .view-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ─── Lobby View ─── */
    #lobby-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .lobby-card {
      background: #1E1F22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .lobby-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .lobby-header h2 {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .lobby-header p {
      color: #949BA4;
      font-size: 12.5px;
    }

    .preview-box {
      width: 100%;
      height: 200px;
      background: #111214;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #949BA4;
    }

    .preview-avatar .avatar-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #2B2D31;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .preview-controls {
      position: absolute;
      bottom: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 31, 34, 0.85);
      backdrop-filter: blur(8px);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }

    .btn-circle.active {
      background: #23A55A;
      border-color: #23A55A;
    }

    .btn-circle.off {
      background: #DA373C;
      border-color: #DA373C;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #DBDEE1;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: #2B2D31;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #FFF;
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: #5865F2;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: #5865F2;
      border: none;
      border-radius: 12px;
      color: #FFF;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
      transition: all 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ─── Discord Call View ─── */
    #call-view {
      flex: 1;
      display: none;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ─── Stage / Grid Container ─── */
    .call-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      overflow-y: auto;
      max-height: calc(100vh - 125px);
    }

    /* Normal Grid */
    .call-grid {
      flex: 1;
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      align-content: center;
      justify-content: center;
    }

    @media (max-width: 600px) {
      .call-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ─── Spotlight Mode ─── */
    #call-view.spotlight-active .call-grid {
      display: none;
    }

    .spotlight-stage {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 8px;
    }

    #call-view.spotlight-active .spotlight-stage {
      display: flex;
    }

    .spotlight-main {
      flex: 1;
      min-height: 260px;
      position: relative;
    }

    .spotlight-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      height: 95px;
      flex-shrink: 0;
    }

    .spotlight-strip .video-card {
      width: 120px;
      min-height: 85px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .spotlight-strip .card-badge-name {
      font-size: 9.5px;
      padding: 2px 6px;
    }

    .spotlight-strip .card-avatar .avatar-img {
      width: 36px;
      height: 36px;
      font-size: 16px;
    }

    /* Floating Spotlight Header Pill */
    .spotlight-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(17, 18, 20, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s;
    }

    .spotlight-pill:hover {
      background: rgba(88, 101, 242, 0.9);
      border-color: #5865F2;
    }

    /* ─── Video Card (Discord Style) ─── */
    .video-card {
      background: #1E1F22;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    }

    .video-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .video-card.speaking {
      border: 2px solid #23A55A !important;
      box-shadow: 0 0 16px rgba(35, 165, 90, 0.45);
    }

    .video-player {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .video-player.mirror {
      transform: scaleX(-1);
    }

    .card-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 1;
    }

    .card-avatar .avatar-img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #2B2D31;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #5865F2;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .card-badge-name {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(17, 18, 20, 0.75);
      backdrop-filter: blur(6px);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 10;
    }

    .card-badge-role {
      background: rgba(88, 101, 242, 0.25);
      color: #5865F2;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: 800;
    }

    .card-badge-mic {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(17, 18, 20, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
    }

    .card-badge-mic.muted {
      background: #DA373C;
      color: #FFF;
    }

    .card-badge-mic.unmuted {
      background: rgba(35, 165, 90, 0.2);
      color: #23A55A;
      border: 1px solid rgba(35, 165, 90, 0.4);
    }

    /* ─── Discord Floating Control Dock ─── */
    .control-dock {
      background: #18191C;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: sticky;
      bottom: 0;
      z-index: 100;
    }

    .dock-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      color: #FFF;
      cursor: pointer;
    }

    .dock-btn .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2B2D31;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }

    .dock-btn .btn-icon.active {
      background: #23A55A;
      border-color: #23A55A;
      box-shadow: 0 4px 10px rgba(35, 165, 90, 0.4);
    }

    .dock-btn .btn-icon.off {
      background: #DA373C;
      border-color: #DA373C;
      box-shadow: 0 4px 10px rgba(218, 55, 60, 0.4);
    }

    .dock-btn .btn-icon.leave {
      background: rgba(218, 55, 60, 0.25);
      border-color: rgba(218, 55, 60, 0.6);
      color: #DA373C;
    }

    .dock-btn .btn-label {
      font-size: 10px;
      font-weight: 700;
      color: #949BA4;
    }

    /* ─── Error / Ended Screen ─── */
    #status-view {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .status-box {
      background: #1E1F22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px 20px;
      max-width: 380px;
      width: 100%;
    }

    .status-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(218, 55, 60, 0.15);
      color: #DA373C;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 14px;
    }

    .status-box h3 {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .status-box p {
      color: #949BA4;
      font-size: 12.5px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Discord Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-logo">İ</div>
      <div>
        <div class="brand-title" id="nav-room-title">İdrak Liseyi Meet</div>
        <div class="brand-sub" id="nav-host-info">Canlı Video Görüşmə</div>
      </div>
    </div>
    <div class="status-badge" id="nav-status">
      <span class="status-dot"></span>
      <span id="nav-status-text">Qoşulmağa Hazır</span>
    </div>
  </header>

  <main class="view-container">

    <!-- 1. Lobby Screen (Pre-Join) -->
    <section id="lobby-view">
      <div class="lobby-card">
        <div class="lobby-header">
          <h2 id="lobby-title">Toplantıya Qoşul</h2>
          <p id="lobby-desc">Qonaq kimi canlı görüşməyə daxil olursunuz</p>
        </div>

        <div class="preview-box">
          <div id="preview-video-container" style="width:100%;height:100%;display:none;"></div>
          <div class="preview-avatar" id="preview-avatar">
            <div class="avatar-circle">👤</div>
            <span style="font-size:11.5px;font-weight:600;">Kamera Bağlıdır</span>
          </div>

          <div class="preview-controls">
            <button class="btn-circle off" id="btn-toggle-mic" title="Mikrofon">🎤</button>
            <button class="btn-circle off" id="btn-toggle-cam" title="Kamera">📷</button>
            <button class="btn-circle" id="btn-switch-cam" title="Kameranı Çevir" style="display:none;">🔄</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="guest-name">Adınız və Soyadınız:</label>
          <input type="text" id="guest-name" class="form-input" placeholder="Məs: Samir Əliyev (Valideyn)" maxlength="40">
        </div>

        <button class="btn-primary" id="btn-join">
          <span>🚀 Görüşməyə Qoşul</span>
        </button>
      </div>
    </section>

    <!-- 2. Call Screen (In-Meeting) -->
    <section id="call-view">
      <div class="call-content">

        <!-- Grid View (All tiles) -->
        <div class="call-grid" id="video-grid">
          <!-- Local Tile -->
          <div class="video-card" id="local-tile" onclick="toggleSpotlight('local-tile')">
            <div class="video-player mirror" id="local-video-player"></div>
            <div class="card-avatar" id="local-avatar">
              <div class="avatar-img" id="local-initials">S</div>
              <div style="font-size:12px;font-weight:700;" id="local-name-display">Siz</div>
            </div>
            <div class="card-badge-name">
              <span id="local-badge-name">Siz (Qonaq)</span>
              <span class="card-badge-role">Mən</span>
            </div>
            <div class="card-badge-mic unmuted" id="local-mic-badge">🎤</div>
          </div>
        </div>

        <!-- Spotlight Stage View (When a tile is clicked) -->
        <div class="spotlight-stage" id="spotlight-stage">
          <div class="spotlight-main" id="spotlight-main">
            <div class="spotlight-pill" onclick="exitSpotlight()">
              <span>🔲 Grid-ə Qayıt</span>
            </div>
            <!-- Focused card moves here -->
          </div>
          <div class="spotlight-strip" id="spotlight-strip">
            <!-- Other participant cards move here -->
          </div>
        </div>

      </div>

      <!-- Dock Controls -->
      <footer class="control-dock">
        <button class="dock-btn" id="dock-mic">
          <div class="btn-icon active" id="dock-mic-icon">🎤</div>
          <span class="btn-label" id="dock-mic-label">Səsim Açıq</span>
        </button>

        <button class="dock-btn" id="dock-cam">
          <div class="btn-icon active" id="dock-cam-icon">📹</div>
          <span class="btn-label" id="dock-cam-label">Kamera Açıq</span>
        </button>

        <button class="dock-btn" id="dock-flip" style="display:none;">
          <div class="btn-icon" id="dock-flip-icon">🔄</div>
          <span class="btn-label">Çevir</span>
        </button>

        <button class="dock-btn" id="dock-leave">
          <div class="btn-icon leave">📞</div>
          <span class="btn-label" style="color:#DA373C;">Ayrıl</span>
        </button>
      </footer>
    </section>

    <!-- 3. Status / Ended View -->
    <section id="status-view">
      <div class="status-box">
        <div class="status-icon" id="status-icon">🛑</div>
        <h3 id="status-heading">Görüşmə Başa Çatdı</h3>
        <p id="status-msg">Bu otaq müəllim tərəfindən sonlandırılıb və ya qonaq linki deaktiv edilib.</p>
      </div>
    </section>

  </main>

  <script>
    // ── Extract Room ID from URL path ──
    const pathParts = window.location.pathname.split('/');
    const roomId = pathParts[pathParts.length - 1] || 'default-room';

    // ── Agora & Media State ──
    let agoraClient = null;
    let localAudioTrack = null;
    let localVideoTrack = null;
    let isMicOn = true;
    let isCamOn = true;
    let currentCameraIndex = 0;
    let availableCameras = [];
    let spotlightTileId = null;

    // DOM Elements
    const lobbyView = document.getElementById('lobby-view');
    const callView = document.getElementById('call-view');
    const statusView = document.getElementById('status-view');
    const guestNameInput = document.getElementById('guest-name');
    const btnJoin = document.getElementById('btn-join');
    const btnToggleMic = document.getElementById('btn-toggle-mic');
    const btnToggleCam = document.getElementById('btn-toggle-cam');
    const btnSwitchCam = document.getElementById('btn-switch-cam');
    const previewContainer = document.getElementById('preview-video-container');
    const previewAvatar = document.getElementById('preview-avatar');
    const videoGrid = document.getElementById('video-grid');
    const spotlightMain = document.getElementById('spotlight-main');
    const spotlightStrip = document.getElementById('spotlight-strip');

    // Check Room Status on load
    async function checkRoom() {
      try {
        const res = await fetch(`/api/rooms/${encodeURIComponent(roomId)}/status`);
        if (!res.ok) {
          showStatusScreen('Otaq Tapılmadı', 'Görüşmə linki etibarsızdır və ya vaxtı keçib.');
          return;
        }
        const data = await res.json();
        if (!data.active) {
          showStatusScreen('Görüşmə Başa Çatıb', 'Bu otaq bağlanıb və daxil olmaq mümkün deyil.');
          return;
        }

        document.getElementById('nav-room-title').innerText = data.title || 'İdrak Liseyi Meet';
        document.getElementById('nav-host-info').innerText = `${data.hostName || 'Müəllim'} tərəfindən aparılır`;
        document.getElementById('lobby-title').innerText = data.title || 'Toplantıya Qoşul';

        initPreview();
      } catch (err) {
        console.error('Error fetching room status:', err);
      }
    }

    // Initialize Camera & Mic preview in Lobby
    async function initPreview() {
      try {
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
        isMicOn = true;
        btnToggleMic.className = 'btn-circle active';
      } catch (e) {
        console.warn('Mikrofon tapılmadı:', e);
        isMicOn = false;
        btnToggleMic.className = 'btn-circle off';
      }

      try {
        availableCameras = await AgoraRTC.getCameras();
        if (availableCameras.length > 0) {
          localVideoTrack = await AgoraRTC.createCameraVideoTrack();
          isCamOn = true;
          btnToggleCam.className = 'btn-circle active';
          previewContainer.style.display = 'block';
          previewAvatar.style.display = 'none';
          localVideoTrack.play('preview-video-container');
          if (availableCameras.length > 1) {
            btnSwitchCam.style.display = 'flex';
            document.getElementById('dock-flip').style.display = 'flex';
          }
        } else {
          throw new Error('No camera');
        }
      } catch (e) {
        console.warn('Kamera tapılmadı:', e);
        isCamOn = false;
        btnToggleCam.className = 'btn-circle off';
        previewContainer.style.display = 'none';
        previewAvatar.style.display = 'flex';
      }
    }

    // Toggle Mic in Lobby
    btnToggleMic.onclick = async () => {
      isMicOn = !isMicOn;
      if (localAudioTrack) await localAudioTrack.setEnabled(isMicOn);
      btnToggleMic.className = isMicOn ? 'btn-circle active' : 'btn-circle off';
      btnToggleMic.innerText = isMicOn ? '🎤' : '🔇';
    };

    // Toggle Cam in Lobby
    btnToggleCam.onclick = async () => {
      isCamOn = !isCamOn;
      if (localVideoTrack) await localVideoTrack.setEnabled(isCamOn);
      if (isCamOn) {
        previewContainer.style.display = 'block';
        previewAvatar.style.display = 'none';
      } else {
        previewContainer.style.display = 'none';
        previewAvatar.style.display = 'flex';
      }
      btnToggleCam.className = isCamOn ? 'btn-circle active' : 'btn-circle off';
      btnToggleCam.innerText = isCamOn ? '📷' : '🚫';
    };

    // Switch Camera (Front/Back)
    async function switchCamera() {
      if (availableCameras.length < 2 || !localVideoTrack) return;
      currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      const deviceId = availableCameras[currentCameraIndex].deviceId;
      await localVideoTrack.setDevice(deviceId);
    }
    btnSwitchCam.onclick = switchCamera;
    document.getElementById('dock-flip').onclick = switchCamera;

    // Join Meeting
    btnJoin.onclick = async () => {
      const guestName = guestNameInput.value.trim();
      if (!guestName) {
        alert('Zəhmət olmasa adınızı və soyadınızı daxil edin.');
        guestNameInput.focus();
        return;
      }

      btnJoin.disabled = true;
      btnJoin.innerText = 'Qoşulur...';

      try {
        const joinRes = await fetch(`/api/rooms/${encodeURIComponent(roomId)}/join-guest`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guestName }),
        });

        if (!joinRes.ok) {
          const errData = await joinRes.json();
          alert(errData.error || 'Otağa qoşulmaq mümkün olmadı.');
          btnJoin.disabled = false;
          btnJoin.innerText = '🚀 Görüşməyə Qoşul';
          return;
        }

        const { appId, channelName, token, uid } = await joinRes.json();

        // Switch to In-Call View
        lobbyView.style.display = 'none';
        callView.style.display = 'flex';
        document.getElementById('nav-status-text').innerText = 'Canlı Qoşuldu';

        // Update local tile info
        document.getElementById('local-badge-name').innerText = `${guestName} (Qonaq)`;
        document.getElementById('local-name-display').innerText = guestName;
        document.getElementById('local-initials').innerText = guestName.charAt(0).toUpperCase();

        // Initialize Agora Client
        agoraClient = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });

        // Event: Remote user joined
        agoraClient.on('user-joined', (user) => {
          console.log('👤 Uzaq istifadəçi qoşuldu:', user.uid);
          renderRemoteUser(user);
        });

        // Event: Remote user published audio/video
        agoraClient.on('user-published', async (user, mediaType) => {
          console.log(`📡 user-published: uid=${user.uid}, type=${mediaType}`);
          await agoraClient.subscribe(user, mediaType);
          renderRemoteUser(user);

          if (mediaType === 'audio' && user.audioTrack) {
            user.audioTrack.play();
          }
          if (mediaType === 'video' && user.videoTrack) {
            renderRemoteUser(user);
          }
        });

        // Event: Remote user unpublished
        agoraClient.on('user-unpublished', (user, mediaType) => {
          if (mediaType === 'video') {
            const playerDiv = document.getElementById(`remote-player-${user.uid}`);
            const avatarDiv = document.getElementById(`remote-avatar-${user.uid}`);
            if (playerDiv) playerDiv.style.display = 'none';
            if (avatarDiv) avatarDiv.style.display = 'flex';
          }
        });

        // Event: Remote user left
        agoraClient.on('user-left', (user) => {
          const tile = document.getElementById(`user-tile-${user.uid}`);
          if (tile) {
            if (spotlightTileId === `user-tile-${user.uid}`) {
              exitSpotlight();
            }
            tile.remove();
          }
        });

        // Volume Indicator (Active Speaker)
        agoraClient.enableAudioVolumeIndicator();
        agoraClient.on('volume-indicator', (volumes) => {
          volumes.forEach((vol) => {
            const isSpeaking = vol.level > 15;
            if (vol.uid === uid || vol.uid === 0) {
              const localT = document.getElementById('local-tile');
              if (localT) localT.classList.toggle('speaking', isSpeaking);
            } else {
              const tile = document.getElementById(`user-tile-${vol.uid}`);
              if (tile) tile.classList.toggle('speaking', isSpeaking);
            }
          });
        });

        // Join Agora Channel
        await agoraClient.join(appId, channelName, token, uid);

        // Render any existing remote users
        if (agoraClient.remoteUsers && agoraClient.remoteUsers.length > 0) {
          agoraClient.remoteUsers.forEach((user) => {
            renderRemoteUser(user);
          });
        }

        // Ensure mic track exists
        if (!localAudioTrack) {
          try {
            localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
          } catch (e) {
            console.warn('Mikrofon yaradıla bilmədi:', e);
          }
        }

        // Try creating camera track
        if (!localVideoTrack && isCamOn) {
          try {
            localVideoTrack = await AgoraRTC.createCameraVideoTrack();
          } catch (e) {
            console.warn('Kamera yaradıla bilmədi:', e);
            isCamOn = false;
          }
        }

        // Publish available tracks
        const tracksToPublish = [];
        if (localAudioTrack) tracksToPublish.push(localAudioTrack);
        if (localVideoTrack) tracksToPublish.push(localVideoTrack);
        if (tracksToPublish.length > 0) {
          await agoraClient.publish(tracksToPublish);
        }

        // Play local video in call grid (or show avatar if no camera)
        if (localVideoTrack && isCamOn) {
          localVideoTrack.play('local-video-player');
          document.getElementById('local-avatar').style.display = 'none';
        } else {
          document.getElementById('local-video-player').style.display = 'none';
          document.getElementById('local-avatar').style.display = 'flex';
        }

        // Setup Dock Button Events
        setupDockControls();

        // Start Room Status Watcher (Heartbeat) - auto-destroys when Host ends meeting
        startRoomStatusWatcher();

      } catch (err) {
        console.error('Join error:', err);
        alert('Görüşməyə qoşularkən xəta baş verdi: ' + err.message);
        btnJoin.disabled = false;
        btnJoin.innerText = '🚀 Görüşməyə Qoşul';
      }
    };

    // ── Spotlight Mode Handlers ──
    function toggleSpotlight(tileId) {
      if (spotlightTileId === tileId) {
        exitSpotlight();
        return;
      }
      enterSpotlight(tileId);
    }

    function enterSpotlight(tileId) {
      const targetTile = document.getElementById(tileId);
      if (!targetTile) return;

      spotlightTileId = tileId;
      callView.classList.add('spotlight-active');

      // Place target tile into spotlight main
      spotlightMain.appendChild(targetTile);

      // Move all other tiles into strip
      const allCards = document.querySelectorAll('.video-card');
      allCards.forEach((card) => {
        if (card.id !== tileId) {
          spotlightStrip.appendChild(card);
        }
      });
    }

    function exitSpotlight() {
      spotlightTileId = null;
      callView.classList.remove('spotlight-active');

      // Move all cards back to videoGrid
      const allCards = document.querySelectorAll('.video-card');
      allCards.forEach((card) => {
        videoGrid.appendChild(card);
      });
    }

    let roomStatusWatcher = null;

    function startRoomStatusWatcher() {
      if (roomStatusWatcher) clearInterval(roomStatusWatcher);
      roomStatusWatcher = setInterval(async () => {
        try {
          const res = await fetch(`/api/rooms/${encodeURIComponent(roomId)}/status`);
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            clearInterval(roomStatusWatcher);
            roomStatusWatcher = null;
            await forceEndCall('🛑 Görüşmə Başa Çatdı', data.error || 'Host görüşməni sonlandırdı. Link artıq etibarsızdır.');
            return;
          }
          const data = await res.json();
          if (!data.active) {
            clearInterval(roomStatusWatcher);
            roomStatusWatcher = null;
            await forceEndCall('🛑 Görüşmə Başa Çatdı', 'Host görüşməni sonlandırdı. Link artıq etibarsızdır.');
          }
        } catch (e) {
          // Ignore transient network errors
        }
      }, 2500);
    }

    async function forceEndCall(heading, msg) {
      if (roomStatusWatcher) {
        clearInterval(roomStatusWatcher);
        roomStatusWatcher = null;
      }
      try {
        if (localAudioTrack) {
          localAudioTrack.stop();
          localAudioTrack.close();
          localAudioTrack = null;
        }
        if (localVideoTrack) {
          localVideoTrack.stop();
          localVideoTrack.close();
          localVideoTrack = null;
        }
        if (agoraClient) {
          await agoraClient.leave();
          agoraClient = null;
        }
      } catch (e) {}
      showStatusScreen(heading, msg);
    }

    function renderRemoteUser(user) {
      let tile = document.getElementById(`user-tile-${user.uid}`);
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'video-card';
        tile.id = `user-tile-${user.uid}`;
        tile.onclick = () => toggleSpotlight(`user-tile-${user.uid}`);
        tile.innerHTML = `
          <div class="video-player" id="remote-player-${user.uid}" style="display:none;"></div>
          <div class="card-avatar" id="remote-avatar-${user.uid}" style="display:flex;">
            <div class="avatar-img">🎓</div>
            <div style="font-size:12px;font-weight:700;">İştirakçı</div>
          </div>
          <div class="card-badge-name">
            <span>İştirakçı (#${user.uid.toString().slice(-4)})</span>
          </div>
          <div class="card-badge-mic unmuted" id="remote-mic-${user.uid}">🎤</div>
        `;

        if (spotlightTileId) {
          spotlightStrip.appendChild(tile);
        } else {
          videoGrid.appendChild(tile);
        }
      }

      const playerDiv = document.getElementById(`remote-player-${user.uid}`);
      const avatarDiv = document.getElementById(`remote-avatar-${user.uid}`);
      if (user.videoTrack) {
        if (playerDiv) {
          playerDiv.style.display = 'block';
          user.videoTrack.play(`remote-player-${user.uid}`);
        }
        if (avatarDiv) avatarDiv.style.display = 'none';
      } else {
        if (playerDiv) playerDiv.style.display = 'none';
        if (avatarDiv) avatarDiv.style.display = 'flex';
      }
    }

    function setupDockControls() {
      const dockMic = document.getElementById('dock-mic');
      const dockMicIcon = document.getElementById('dock-mic-icon');
      const dockMicLabel = document.getElementById('dock-mic-label');
      const localMicBadge = document.getElementById('local-mic-badge');

      dockMic.onclick = async () => {
        isMicOn = !isMicOn;
        if (localAudioTrack) await localAudioTrack.setEnabled(isMicOn);
        dockMicIcon.className = isMicOn ? 'btn-icon active' : 'btn-icon off';
        dockMicIcon.innerText = isMicOn ? '🎤' : '🔇';
        dockMicLabel.innerText = isMicOn ? 'Səsim Açıq' : 'Səssiz';
        localMicBadge.className = isMicOn ? 'card-badge-mic unmuted' : 'card-badge-mic muted';
        localMicBadge.innerText = isMicOn ? '🎤' : '🔇';
      };

      const dockCam = document.getElementById('dock-cam');
      const dockCamIcon = document.getElementById('dock-cam-icon');
      const dockCamLabel = document.getElementById('dock-cam-label');
      const localVideoPlayer = document.getElementById('local-video-player');
      const localAvatar = document.getElementById('local-avatar');

      dockCam.onclick = async () => {
        isCamOn = !isCamOn;
        if (localVideoTrack) await localVideoTrack.setEnabled(isCamOn);
        dockCamIcon.className = isCamOn ? 'btn-icon active' : 'btn-icon off';
        dockCamIcon.innerText = isCamOn ? '📹' : '🚫';
        dockCamLabel.innerText = isCamOn ? 'Kamera Açıq' : 'Kamera Bağlı';
        localVideoPlayer.style.display = isCamOn ? 'block' : 'none';
        localAvatar.style.display = isCamOn ? 'none' : 'flex';
      };

      document.getElementById('dock-leave').onclick = async () => {
        if (confirm('Toplantıdan çıxmaq istəyirsiniz?')) {
          await leaveCall();
        }
      };
    }

    async function leaveCall() {
      if (roomStatusWatcher) {
        clearInterval(roomStatusWatcher);
        roomStatusWatcher = null;
      }
      try {
        if (localAudioTrack) {
          localAudioTrack.stop();
          localAudioTrack.close();
          localAudioTrack = null;
        }
        if (localVideoTrack) {
          localVideoTrack.stop();
          localVideoTrack.close();
          localVideoTrack = null;
        }
        if (agoraClient) {
          await agoraClient.leave();
          agoraClient = null;
        }
        await fetch(`/api/rooms/${encodeURIComponent(roomId)}/leave-guest`, { method: 'POST' }).catch(() => {});
      } catch (e) {}
      showStatusScreen('Ayrıldınız', 'Canlı görüşmədən uğurla çıxış etdiniz.');
    }

    function showStatusScreen(heading, msg) {
      lobbyView.style.display = 'none';
      callView.style.display = 'none';
      statusView.style.display = 'flex';
      document.getElementById('status-heading').innerText = heading;
      document.getElementById('status-msg').innerText = msg;
      document.getElementById('nav-status-text').innerText = 'Bağlandı';
      document.getElementById('nav-status').style.borderColor = '#DA373C';
      document.getElementById('nav-status').style.color = '#DA373C';
    }

    // Start checking room
    checkRoom();
  </script>
</body>
</html>
